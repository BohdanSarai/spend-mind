[project]
name = "spend-mind"
version = "0.1.0"
description = "AI-powered personal expense tracking and analytics assistant."
authors = [
    { name = "Bohdan Sarai", email = "1wwwbogdan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.165.0",
    "openai>=3.60.0",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
